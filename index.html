<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WMSUCET Prep</title>
<style>
:root {
  --bg:#f5f1ea; --surface:#fffdf8; --surface2:#f6f1e7; --text:#1d1a1c; --muted:#6c6560; --line:#e4dccd;
  --ink:#2a1519; --ink2:#3a2025; --ink-text:#f6ede8; --ink-muted:#c9b8b3; --gold:#d9a441;
  --head-bg:#7b1e2b; --head-ink:#ffffff;
  --brand:#7b1e2b; --on-brand:#ffffff; --brand-soft:#f4e3e5;
  --coach:#fbf0d6; --coach-line:#e8cf91;
  --good:#1d7a4b; --good-soft:#e2f3ea; --bad:#b3261e; --bad-soft:#fbe8e6; --warn:#8a5a00; --warn-soft:#fff3d1;
  --c-math:#2b5cc4; --c-math-s:#e4ecfb;
  --c-sci:#0b7766;  --c-sci-s:#dff2ee;
  --c-eng:#b36500;  --c-eng-s:#fbeed6;
  --c-rsn:#7743c0;  --c-rsn-s:#efe6fa;
  --c-fil:#b02a6a;  --c-fil-s:#f9e4ee;
  --c-gen:#a23a62;  --c-gen-s:#f8e5ee;
  --on-h:#ffffff;
  --shadow:0 1px 2px rgba(40,20,20,.05), 0 6px 18px rgba(40,20,20,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#141010; --surface:#1d1818; --surface2:#262020; --text:#f2ebe7; --muted:#a99f9a; --line:#372f2e;
    --ink:#0e0a0b; --ink2:#241a1c; --ink-text:#f6ede8; --ink-muted:#b9a9a4; --gold:#e3b04f;
    --head-bg:#4a141c; --head-ink:#f7ecec;
    --brand:#e58b93; --on-brand:#2a0a0e; --brand-soft:#3b2326;
    --coach:#33290f; --coach-line:#6b561c;
    --good:#58c78b; --good-soft:#18362a; --bad:#ff8c82; --bad-soft:#40201d; --warn:#f0bd5a; --warn-soft:#3a2d10;
    --c-math:#7fa4f2; --c-math-s:#1b2640;
    --c-sci:#5ccdb8;  --c-sci-s:#12302b;
    --c-eng:#eeae5a;  --c-eng-s:#382a10;
    --c-rsn:#b998f0;  --c-rsn-s:#2a2044;
    --c-fil:#ec8fb8;  --c-fil-s:#3a1f2c;
    --c-gen:#e68fb1;  --c-gen-s:#3a2030;
    --on-h:#14100f;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#141010; --surface:#1d1818; --surface2:#262020; --text:#f2ebe7; --muted:#a99f9a; --line:#372f2e;
  --ink:#0e0a0b; --ink2:#241a1c; --ink-text:#f6ede8; --ink-muted:#b9a9a4; --gold:#e3b04f;
  --head-bg:#4a141c; --head-ink:#f7ecec;
  --brand:#e58b93; --on-brand:#2a0a0e; --brand-soft:#3b2326;
  --coach:#33290f; --coach-line:#6b561c;
  --good:#58c78b; --good-soft:#18362a; --bad:#ff8c82; --bad-soft:#40201d; --warn:#f0bd5a; --warn-soft:#3a2d10;
  --c-math:#7fa4f2; --c-math-s:#1b2640;
  --c-sci:#5ccdb8;  --c-sci-s:#12302b;
  --c-eng:#eeae5a;  --c-eng-s:#382a10;
  --c-rsn:#b998f0;  --c-rsn-s:#2a2044;
    --c-gen:#e68fb1;  --c-gen-s:#3a2030;
  --on-h:#14100f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 70px); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; font-size: 16px; -webkit-text-size-adjust: 100%; }
body::before { content:""; position:fixed; inset:0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 40; }
button { font: inherit; color: inherit; cursor: pointer; }
h1,h2,h3,h4 { line-height: 1.2; margin: 0; font-family: var(--serif); font-weight: 600; }
.mono { font-family: var(--mono); }
.lab { font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.h-math { --h: var(--c-math); --hs: var(--c-math-s); }
.h-sci  { --h: var(--c-sci);  --hs: var(--c-sci-s); }
.h-eng  { --h: var(--c-eng);  --hs: var(--c-eng-s); }
.h-rsn  { --h: var(--c-rsn);  --hs: var(--c-rsn-s); }
.h-fil  { --h: var(--c-fil);  --hs: var(--c-fil-s); }
.h-gen  { --h: var(--c-gen);  --hs: var(--c-gen-s); }
.ic { width: 20px; height: 20px; flex: none; }

/* ── Shell ── */
.shell { display: grid; grid-template-columns: 244px minmax(0,1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; max-height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px 18px; display: flex; flex-direction: column; min-height: calc(100vh - env(safe-area-inset-top, 0px)); }
.logo { display:flex; align-items:center; gap: 10px; padding: 0 8px 18px; }
.logo i { font-style: normal; width: 36px; height: 36px; border-radius: 9px; background: var(--ink); color: var(--gold); display:grid; place-items:center; font-family: var(--serif); font-weight: 700; font-size: 1.15rem; }
.logo b { font-family: var(--serif); font-size: 1.12rem; line-height: 1.1; }
.logo small { display:block; font-family: var(--mono); font-size: .6rem; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.side .lab { padding: 8px 10px 6px; }
.nav { display:flex; align-items:center; gap: 12px; width: 100%; text-align:left; padding: 10px 12px; border: 0; background: transparent; border-radius: 10px; color: var(--text); font-size: .95rem; }
.nav:hover { background: var(--surface2); }
.nav[aria-current="page"] { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
.side-foot { margin-top: auto; padding: 14px 10px 0; }
.content { min-width: 0; }
.mtop { display: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--head-bg); color: var(--head-ink); padding: 10px 16px; align-items:center; gap: 10px; }
.mtop .logo { padding: 0; } .mtop .logo i { background: rgba(255,255,255,.14); } .mtop .logo small { color: rgba(255,255,255,.7); }
.mnav { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--surface); border-top: 1px solid var(--line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)); justify-content: flex-start; overflow-x: auto; }
.mnav .nav { flex-direction: column; gap: 2px; padding: 6px 2px; font-size: .66rem; width: auto; flex: 1 0 68px; text-align:center; border-radius: 8px; }
main { max-width: 1120px; margin: 0 auto; padding: 28px 28px 64px; }
@media (max-width: 899px) {
  .shell { display: block; } .side { display: none; } .mtop, .mnav { display: flex; }
  main { padding: 18px 14px 96px; }
}

/* ── Primitives ── */
.page-h { margin-bottom: 18px; } .page-h h1 { font-size: 2rem; margin-top: 4px; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
.card h2 { font-size: 1.3rem; }
.stack > * + * { margin-top: 16px; }
.row { display:flex; gap: 10px; align-items:center; flex-wrap: wrap; } .between { justify-content: space-between; } .grow { flex: 1 1 auto; min-width: 0; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding: 11px 18px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; transition: transform .05s, filter .15s, border-color .15s; }
.btn:hover { border-color: var(--brand); } .btn:active { transform: translateY(1px); }
.btn:focus-visible, .opt:focus-visible, .chip:focus-visible, .nav:focus-visible, .ccard:focus-visible, .arow:focus-visible, .seg button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.btn.primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); } .btn.primary:hover { filter: brightness(1.1); }
.btn.dark { background: #f6ede8; color: #2a1519; border-color: transparent; width: 100%; justify-content: center; padding: 13px; }
.btn.outline-l { background: transparent; color: var(--ink-text); border-color: rgba(255,255,255,.35); width: 100%; padding: 13px; }
.btn.ghost { background: transparent; } .btn.danger { color: var(--bad); border-color: var(--bad); } .btn.sm { padding: 7px 12px; font-size: .86rem; border-radius: 8px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.pill { display:inline-block; padding: 2px 9px; border-radius: 999px; font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-family: var(--mono); background: var(--hs, var(--brand-soft)); color: var(--h, var(--brand)); border: 1px solid transparent; }
.pill.good { background: var(--good-soft); color: var(--good); } .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.plain { background: transparent; color: var(--muted); border-color: var(--line); }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.chip.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.chips { display:flex; flex-wrap: wrap; gap: 8px; }
.seg { display:flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { flex: 1; border: 0; background: transparent; padding: 11px 14px; font-weight: 600; display:flex; gap: 8px; justify-content:center; align-items:center; }
.seg button.on { background: var(--ink); color: var(--ink-text); }
.bar { height: 8px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--line); overflow: hidden; }
.bar > i { display:block; height: 100%; background: var(--h, var(--brand)); border-radius: 99px; }
select, .inp { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface2); color: var(--text); font: inherit; }
select:disabled { opacity: .55; }
.field { margin-top: 18px; } .field:first-child { margin-top: 0; } .field > .lab { display:block; margin-bottom: 8px; }
.banner { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 12px; padding: 12px 14px; }
.warnbox { background: var(--coach); border: 1px solid var(--coach-line); border-radius: 12px; padding: 12px 14px; font-size: .92rem; }
.coach { background: var(--coach); border: 1px solid var(--coach-line); border-radius: 16px; padding: 16px 18px; }
.coach p { margin: 6px 0 10px; }

/* ── Dashboard ── */
.dgrid { display:grid; grid-template-columns: minmax(0,1.7fr) minmax(0,1fr); gap: 18px; align-items: start; }
@media (max-width: 899px) { .dgrid { grid-template-columns: 1fr; } }
.ready { display:flex; gap: 22px; align-items:center; flex-wrap: wrap; margin-top: 12px; }
.ring { --p: 0; --ringc: var(--brand); width: 150px; height: 150px; border-radius: 50%; display:grid; place-items:center; flex: none; background: conic-gradient(var(--ringc) calc(var(--p) * 1%), var(--surface2) 0); }
.ring > div { width: 120px; height: 120px; border-radius: 50%; background: var(--surface); display:grid; place-items:center; align-content:center; text-align:center; }
.ring b { font-family: var(--serif); font-size: 2.2rem; line-height: 1; font-weight: 600; }
.ring span { font-family: var(--mono); font-size: .56rem; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.mbars { flex: 1 1 220px; display:grid; gap: 12px; }
.mbar { display:grid; grid-template-columns: 74px 1fr 34px; gap: 10px; align-items:center; font-size: .9rem; }
.mbar b { font-family: var(--mono); font-size: .85rem; text-align:right; }
.cta { background: var(--ink); color: var(--ink-text); border-radius: 18px; padding: 20px; }
.cta .lab { color: var(--gold); } .cta h2 { font-size: 1.5rem; margin: 6px 0 8px; } .cta p { color: var(--ink-muted); margin: 0 0 14px; }
.cta .meta { display:flex; gap: 8px; align-items:center; color: var(--ink-muted); font-size: .82rem; margin: 8px 0 16px; }
.arow { width:100%; display:flex; align-items:center; gap: 14px; text-align:left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 10px; }
.arow:hover { border-color: var(--brand); box-shadow: var(--shadow); }
.aic { flex: none; width: 40px; height: 40px; border-radius: 10px; display:grid; place-items:center; background: var(--hs, var(--surface2)); color: var(--h, var(--muted)); }
.ares { margin-left: auto; text-align:right; flex: none; } .ares b { font-family: var(--serif); font-size: 1.25rem; }
.ares.good b { color: var(--good); } .ares.warn b { color: var(--warn); } .ares.bad b { color: var(--bad); }
.stat4 { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.stat.dk { background: var(--ink); color: var(--ink-text); border-color: transparent; } .stat.dk .lab { color: var(--ink-muted); }
.stat b { display:block; font-family: var(--serif); font-size: 2.1rem; line-height: 1.1; font-weight: 600; margin: 4px 0; }
.stat b small { font-size: 1rem; color: var(--muted); font-weight: 400; }
.stat span.s { font-size: .8rem; color: var(--muted); } .stat.dk span.s { color: var(--ink-muted); } .stat.dk b small { color: var(--ink-muted); }
.focus { display:flex; align-items:center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); } .focus:first-of-type { border-top: 0; }
.focus .no { font-family: var(--serif); font-size: 1.4rem; color: var(--muted); width: 22px; }

/* ── Cheat-sheet index (cover cards) ── */
.shead { display:flex; align-items:center; gap: 10px; margin: 28px 0 12px; }
.shead .lab { color: var(--h); } .shead::after { content:""; flex:1; height:1px; background: var(--line); }
.cgrid { display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.ccard { text-align:left; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); display:flex; flex-direction: column; }
.ccard:hover { border-color: var(--h); transform: translateY(-1px); }
.ccard .band { background: var(--h); color: var(--on-h); padding: 10px 14px; display:flex; justify-content: space-between; align-items:center; gap: 8px; }
.ccard .band b { font-family: var(--sans, inherit); font-size: 1.02rem; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; }
.ccard .chk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); display:grid; place-items:center; font-size: .75rem; color: transparent; flex: none; }
.ccard .chk.on { background: #fff; color: var(--good); border-color: #fff; }
.ccard .body { padding: 12px 14px 14px; flex: 1; } .ccard .body p { margin: 0 0 10px; font-size: .88rem; color: var(--muted); }

/* ── SparkCharts-style sheet ── */
.chart { border: 1.5px solid var(--h); border-radius: 12px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
.chart-title { background: var(--h); color: var(--on-h); padding: 16px 20px; display:flex; justify-content: space-between; align-items:flex-end; gap: 14px; flex-wrap: wrap; }
.chart-title h1 { font-family: "Segoe UI", system-ui, Arial, sans-serif; font-weight: 900; font-size: 2rem; letter-spacing: .01em; text-transform: uppercase; line-height: 1; }
.chart-title .k { font-family: var(--mono); font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; opacity: .85; display:block; margin-bottom: 6px; }
.chart-title .src { font-size: .78rem; opacity: .9; max-width: 36ch; text-align:right; }
.cols { column-width: 290px; column-gap: 14px; padding: 14px; }
.cb { break-inside: avoid; margin: 0 0 14px; border: 1.5px solid var(--h); border-radius: 7px; overflow: hidden; background: var(--surface); }
.cb-h { background: var(--h); color: var(--on-h); font-weight: 800; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; padding: 5px 10px; }
.cb-b { padding: 8px 10px; font-size: .84rem; line-height: 1.45; }
.cb-b p { margin: 0; }
.cb.sumb .cb-b { background: var(--hs); }
.cb.tipb { --h: var(--good); } .cb.trapb { --h: var(--bad); }
.cb.tipb .cb-h, .cb.trapb .cb-h { color: #fff; }
.fm div { padding: 4px 0; border-bottom: 1px dotted var(--line); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; } .fm div:last-child { border-bottom: 0; }
.cb table { border-collapse: collapse; width: 100%; font-size: .8rem; }
.cb th { background: var(--hs); color: var(--h); text-align:left; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; }
.cb th, .cb td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; } .cb tr:last-child td { border-bottom: 0; } .cb td:first-child { font-weight: 700; }
.cb dl { margin: 0; } .cb dl > div { padding: 4px 0; border-bottom: 1px dotted var(--line); } .cb dl > div:last-child { border-bottom: 0; }
.cb dt { font-weight: 800; color: var(--h); } .cb dd { margin: 0; }
.cb ol { margin: 0; padding-left: 20px; } .cb li { margin: 3px 0; }
.sheet-foot { display:flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.pn { display:flex; justify-content: space-between; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
@media (max-width: 520px) { .chart-title h1 { font-size: 1.5rem; } .chart-title .src { text-align:left; } .cols { padding: 10px; } }

/* ── Exam ── */
.exam-bar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hh, 0px) + 8px); z-index: 10; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; box-shadow: var(--shadow); display:flex; align-items:center; gap: 16px; flex-wrap: wrap; }
.timer { font-family: var(--serif); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--brand); line-height: 1.1; }
.timer.low { color: var(--bad); }
.passage { white-space: pre-line; background: var(--surface2); border: 1px solid var(--line); border-left: 4px solid var(--c-eng); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: .96rem; }
.passage b { display:block; margin-bottom: 4px; color: var(--c-eng); }
.qtext { font-family: var(--serif); font-size: 1.25rem; font-weight: 600; margin: 12px 0 18px; line-height: 1.45; white-space: pre-line; }
.opt { display:flex; gap: 12px; align-items:flex-start; width: 100%; text-align:left; padding: 13px 14px; margin-bottom: 9px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); transition: border-color .12s, background .12s; }
.opt:hover { border-color: var(--brand); }
.opt .ltr { flex:none; width: 28px; height: 28px; border-radius: 50%; display:grid; place-items:center; font-family: var(--mono); font-weight: 700; font-size: .8rem; background: var(--surface2); border: 1px solid var(--line); }
.opt.sel { border-color: var(--brand); background: var(--brand-soft); } .opt.sel .ltr { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.pal { display:flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.dot { width: 36px; height: 36px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--mono); font-weight: 700; font-size: .8rem; position: relative; }
.dot.ans { background: var(--brand-soft); border-color: var(--brand); } .dot.cur { outline: 3px solid var(--brand); outline-offset: 1px; }
.dot.flag::after { content:"⚑"; position:absolute; top:-7px; right:-4px; font-size: .8rem; color: var(--warn); }

/* ── Setup pages ── */
.setup { max-width: 680px; }
.mrow { display:grid; grid-template-columns: 1fr auto auto; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items:center; }
.mrow.tot { border-bottom: 0; border-top: 2px solid var(--text); font-weight: 700; }
.fmt { display:grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.fmt button { text-align:left; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); }
.fmt button.on { border-color: var(--brand); background: var(--brand-soft); } .fmt b { display:block; } .fmt span { font-size: .82rem; color: var(--muted); }
.bul { margin: 8px 0 0; padding-left: 20px; } .bul li { margin: 5px 0; }

<script>
/* ===== QUESTION BANK =====
   q(topic, source, text, options, explanation, extra)
   options[0] is ALWAYS the correct answer; the app shuffles at runtime.
   extra.fixed = index of correct option → options keep their order (for "all of the above" items).
   extra.passage = key into PASSAGES.
*/
const SRC = {
  cet: "CET Review slides",
  pre: "Pre-Test (Delos Reyes)",
  eat: "EAT Mock Exam",
  wms: "WMSUCET Practice Test 1",
  upc: "UPCAT Sim 2011",
  orig: "Original · CET Sail outline",
  draft: "Your draft app",
  gen: "Generated question",
  wst: "Original · WMSUCET-style"
};

const PASSAGES = {
  vf: {
    title: "Urban Vertical Farming",
    text: "Vertical farming utilizes controlled-environment agriculture (CEA) technology. By stacking layers of crops, these facilities can produce significantly more food per square foot than traditional horizontal farms. However, the energy cost of maintaining artificial lighting and climate control remains a contentious hurdle."
  },
  vm: {
    title: "The Mystery of the Voynich Manuscript",
    text: "The Voynich Manuscript is an illustrated codex hand-written in an unknown writing system. Carbon dating has placed the vellum to the early 15th century. Despite rigorous attempts by world-class cryptographers, including top codebreakers from WWI and WWII, the text remains undeciphered, leading some to suggest it is an elaborate 600-year-old hoax."
  },
  ph: {
    title: "The Philippine Political Landscape",
    text: "The Philippine government operates under a presidential system, defined by a tripartite structure of power: the executive, the legislative, and the judicial branches. While the 1987 Constitution was designed to prevent the concentration of power through a system of checks and balances, the current political climate is often characterized by the persistence of political dynasties and a shift toward “personality-based” politics. Critics argue that this hinders the development of a truly ideologically driven party system, whereas supporters suggest that strong leadership is necessary to navigate the country’s complex socioeconomic challenges and decentralized geography."
  }
};

const QUESTIONS = [];
function q(topic, src, text, opts, exp, extra) {
  QUESTIONS.push(Object.assign({ id: "q" + (QUESTIONS.length + 1), topic, src, text, opts, exp }, extra || {}));
}

/* ───────────── MATHEMATICS · ARITHMETIC ───────────── */
q("m-arith", SRC.cet, "Simplify: −2(6 ÷ 3)²", ["−8", "8", "16", "−16"],
  "Parentheses first: 6 ÷ 3 = 2. Then the exponent: 2² = 4. Finally −2 × 4 = −8. Follow PEMDAS and keep the negative sign outside the exponent.");
q("m-arith", SRC.cet, "Expand: 4.90 × 10⁻⁵", ["0.0000490", "0.000490", "0.00490", "0.00000490"],
  "A negative exponent of 5 means move the decimal point 5 places to the LEFT: 4.90 → 0.0000490.");
q("m-arith", SRC.cet, "An agent received 1.59% commission on his sales last week. If his commission was ₱18,009.00, what was the amount of the sale?",
  ["₱1,132,641.51", "₱1,132,461.51", "₱1,136,241.51", "₱123,641"],
  "Base = Part ÷ Rate. The part is the commission (₱18,009) and the rate is 1.59% = 0.0159. 18,009 ÷ 0.0159 = ₱1,132,641.51.");
q("m-arith", SRC.cet, "Evaluate: 4 + 3(−6)² ÷ 18", ["10", "9", "12", "14"],
  "Exponent first: (−6)² = 36. Then multiply/divide left to right: 3 × 36 = 108; 108 ÷ 18 = 6. Finally 4 + 6 = 10.");
q("m-arith", SRC.cet, "Mia bought a second-hand phone for ₱7,800 and paid a 32% deposit. How much does she still have to pay?",
  ["₱5,304.00", "₱5,340.00", "₱2,496.00", "₱2,964.00"],
  "Deposit = 0.32 × 7,800 = ₱2,496. Balance = 7,800 − 2,496 = ₱5,304. (Shortcut: she still owes 68% of ₱7,800.)");
q("m-arith", SRC.draft, "You got an average score of 72 over 100 in three tests. If an average of 75 is passing and you only have one more test, what score must you get in that test to pass?",
  ["84", "92", "82", "78"],
  "Total needed for 4 tests = 75 × 4 = 300. Points so far = 72 × 3 = 216. Needed on the last test = 300 − 216 = 84.");
q("m-arith", SRC.pre, "A student scored 85, 90, 78, and 92 on four tests. What score must they get on the fifth test to average 88?",
  ["95", "97", "89", "91"],
  "Total needed = 88 × 5 = 440. Current total = 85 + 90 + 78 + 92 = 345. Needed = 440 − 345 = 95.");
q("m-arith", SRC.draft, "Chris can finish painting a wall in 6 hours. Gretchen can paint the same wall twice as fast as Chris. How quickly can they finish painting the wall together?",
  ["2 hrs", "3 hrs", "1 hr", "4 hrs"],
  "Gretchen alone: 6 ÷ 2 = 3 hrs. Combined rate = 1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2 wall per hour, so together they need 2 hours.");
q("m-arith", SRC.draft, "A chemist mixes a 5% alcohol solution with 3 liters of a 10% solution to make an 8% solution. About how many liters of the 5% solution are needed?",
  ["2 liters", "4.6 liters", "6 liters", "10.3 liters"],
  "Alcohol balance: 0.05x + 0.10(3) = 0.08(x + 3) → 0.05x + 0.30 = 0.08x + 0.24 → 0.06 = 0.03x → x = 2 liters.");
q("m-arith", SRC.pre, "A car travels 60 km in 1.5 hours. What is its average speed in meters per second?",
  ["11.11", "10.00", "12.50", "13.33"],
  "Speed = 60 ÷ 1.5 = 40 km/h. To convert km/h to m/s, divide by 3.6: 40 ÷ 3.6 ≈ 11.11 m/s.");
q("m-arith", SRC.eat, "Bowl Z contains only marbles. If ¼ of the marbles were removed, the bowl would be filled to ½ of its capacity. If 100 marbles were added, the bowl would be full. How many marbles are in bowl Z?",
  ["200", "120", "250", "300"],
  "Let C = capacity and x = marbles. ¾x = ½C, so x = ⅔C. Adding 100 fills the bowl: ⅔C + 100 = C → 100 = ⅓C → C = 300. Then x = ⅔(300) = 200.");

/* ───────────── MATHEMATICS · ALGEBRA ───────────── */
q("m-alg", SRC.cet, "What is the perimeter of a rectangle whose length and width are 8x − 5 and 2x − 1?",

/* ───────── LANGUAGE: error identification ───────── */
const ERR = "Identify the part of the sentence that contains an error. If there is none, choose “No error.”\n\n";
q("e-gram", SRC.wms, ERR + "“In the 1990’, the People’s Republic of China grew economically, territorially, and culturally.”",
  ["In the 1990’", "the People’s Republic of China", "grew economically, territorially, and culturally", "No error"],
  "A decade takes no apostrophe-only form: it should be ‘the 1990s.’ The rest of the sentence is correct and parallel.", { fixed: 0 });
q("e-gram", SRC.wms, ERR + "“In November 29, 1890, the Imperial Japanese Diet convened for the first time.”",
  ["In November 29, 1890", "the Imperial Japanese Diet", "convened for the first time", "No error"],
  "Use ‘on’ with a specific date (on November 29, 1890); ‘in’ is for months or years alone.", { fixed: 0 });
q("e-gram", SRC.wms, ERR + "“In 2010, Harvard University had an acceptance rate of 6.9%, and will have rejected students with perfect SAT scores.”",
  ["In 2010", "Harvard University had an acceptance rate of 6.9%", "and will have rejected students with perfect SAT scores", "No error"],
  "The sentence is about 2010 (past), so ‘will have rejected’ (future perfect) is a tense error. It should be ‘had rejected.’", { fixed: 2 });
q("e-gram", SRC.wms, ERR + "“Akihiro tried to acquire as many of the valuable and groundbreaking knowledge as he can from the lecture.”",
  ["Akihiro tried to acquire", "as many of the valuable and groundbreaking knowledge", "as he can from the lecture", "No error"],
  "‘Knowledge’ is uncountable, so it takes ‘much,’ not ‘many’: ‘as much of the valuable … knowledge.’", { fixed: 1 });
q("e-gram", SRC.wms, ERR + "“Xabi Alonso’s shot was wide off the mark and the goalkeeper Casillas did not have to make a save.”",
  ["Xabi Alonso’s shot was", "wide off the mark", "and the goalkeeper Casillas did not have to make a save", "No error"],
  "The idiom is ‘wide of the mark,’ not ‘off the mark.’", { fixed: 1 });
q("e-gram", SRC.wms, ERR + "“The proposal made by the British Labour Party was in opposition of privatization of state holdings.”",
  ["The proposal made by the British Labour Party", "was in opposition of privatization", "of state holdings", "No error"],
  "The correct preposition is ‘in opposition to.’", { fixed: 1 });
q("e-gram", SRC.orig2, ERR + "“The committee has reviewed all the applications that were submitted this week.”",
  ["The committee has reviewed", "all the applications", "that were submitted this week", "No error"],
  "‘Committee’ is treated as singular here, so ‘has reviewed’ is correct, and the rest of the sentence is fine. No error.", { fixed: 3 });
q("e-gram", SRC.orig2, ERR + "“Neither the students nor the teacher were aware of the sudden schedule change.”",
  ["Neither the students nor the teacher", "were aware of", "the sudden schedule change", "No error"],
  "With ‘neither … nor,’ the verb agrees with the nearer subject (‘the teacher’), so it should be ‘was aware.’", { fixed: 1 });

  err("He {A|don’t} {B|know} {C|the answer} {D|to the question}.", "A", "A third-person singular subject needs ‘doesn’t.’");
  err("The {A|number of} students {B|who passed} the exam {C|are} {D|higher this year}.", "C", "‘The number of’ takes a singular verb: ‘is.’");

  sc("The manager, together with her assistants, ______ preparing the report.", ["is", "are", "were", "have been"], "The subject is ‘manager’ (singular); ‘together with…’ is only an interruption.");

  /* ───── VOCABULARY: antonyms (booklet Part B style) ───── */
  const an = (w, s, c, wr, e) => add("e-vocab", W, "Choose the word that is the opposite of the meaning of the capitalized word: " + s.replace(w, w.toUpperCase()), [c].concat(wr), e);
  an("verbose", "The report was verbose and repetitive.", "Concise", ["Lengthy", "Detailed", "Technical"], "Verbose means wordy; the opposite is concise.");

  an("mundane", "He wanted an escape from his mundane routine.", "Extraordinary", ["Boring", "Busy", "Daily"], "Mundane means ordinary; the opposite is extraordinary.");
  an("obstinate", "The obstinate child refused to listen.", "Flexible", ["Stubborn", "Quiet", "Clever"], "Obstinate means stubborn; the opposite is flexible or yielding.");
  an("placid", "The lake was placid at dawn.", "Turbulent", ["Cold", "Deep", "Clear"], "Placid means calm; the opposite is turbulent.");
  an("tranquil", "A tranquil village", "Chaotic", ["Remote", "Small", "Old"], "Tranquil means peaceful; the opposite is chaotic.");

  /* ───── IMPROVING SENTENCES (booklet Part IV style) ───── */
  const IMP = "Choose the option that best replaces the underlined (bracketed) portion. Choose A if no improvement is needed.\n\n";
  const imp = (t, c, w, e) => add("e-gram", W, IMP + t, [c].concat(w), e);
  imp("[Neither the manager nor the employees was] informed of the change.", "Neither the manager nor the employees were", ["Neither the manager nor the employees was", "Neither the manager or the employees were", "Neither the manager nor the employees is"], "With neither…nor, the verb agrees with the nearer subject (‘employees’): ‘were.’ Also keep ‘nor’ with ‘neither.’");
  imp("[Between you and I], the project is already late.", "Between you and me", ["Between you and I", "Between yourself and I", "Among you and I"], "After a preposition use the object pronoun ‘me.’");
  imp("She [don’t hardly] have time for hobbies.", "hardly has", ["don’t hardly have", "doesn’t hardly have", "hardly have"], "‘Hardly’ is already negative, so avoid ‘don’t’; the third-person singular verb is ‘has.’");
  imp("The reason for the delay [is because] the shipment was lost.", "is that", ["is because", "was because of", "are because"], "‘The reason is that…’ is standard; ‘reason … because’ is redundant.");
  imp("He is the [more taller] of the two brothers.", "taller", ["more taller", "most taller", "more tall"], "Do not combine ‘more’ with -er.");
  imp("I [lived] in Zamboanga since 2015.", "have lived", ["lived", "was living", "am living"], "‘Since’ with a time that continues to the present needs the present perfect: ‘have lived.’");
  imp("The teacher gave the students [their’s homework] to take home.", "their homework", ["their’s homework", "theirs homework", "there homework"], "‘Their’ is already possessive; it takes no apostrophe or -s before a noun.");
  imp("[Due to the fact that] it rained, the game was cancelled.", "Because", ["Due to the fact that", "On account of the fact being that", "Owing to the fact of"], "‘Because’ says the same thing without extra words.");
  imp("Each of the girls [have their] own locker.", "has her", ["have their", "have her", "has their"], "‘Each’ is singular, so use ‘has’ with a singular pronoun.");

  /* ───── GENERAL INFORMATION ───── */
  const gi = (t, o, e) => add("g-info", W, t, o, e);
  gi("José Rizal was born in which town?", ["Calamba, Laguna", "Bagumbayan, Manila", "Kawit, Cavite", "Malolos, Bulacan"], "Rizal was born in Calamba, Laguna, in 1861.");

  gi("Baguio is known as the:", ["Summer Capital of the Philippines", "Queen City of the South", "City of Smiles", "Pearl of the Orient"], "Baguio’s cool highland climate earned it the title.");
  gi("Cebu is popularly called the:", ["Queen City of the South", "Summer Capital", "Rice Granary", "Cultural Capital"], "Cebu City is the ‘Queen City of the South.’");
  gi("Which province is known as the “Rice Granary of the Philippines”?", ["Nueva Ecija", "Palawan", "Batanes", "Siquijor"], "Nueva Ecija is a leading rice producer.");

  gi("Which scientist discovered penicillin?", ["Alexander Fleming", "Louis Pasteur", "Robert Koch", "Marie Curie"], "Fleming noticed the mold’s antibacterial effect in 1928.");

  gi("Which country gave the Statue of Liberty to the United States?", ["France", "England", "Spain", "Italy"], "France gifted it in 1886.");
  gi("The longest river in Africa is the:", ["Nile", "Congo", "Niger", "Zambezi"], "The Nile flows north to the Mediterranean Sea.");
  gi("The largest continent by area is:", ["Asia", "Africa", "North America", "Europe"], "Asia covers about 30% of Earth’s land.");
  gi("Which planet is famous for its prominent rings?", ["Saturn", "Mars", "Mercury", "Venus"], "Saturn’s ring system is the most extensive.");
  gi("Which organ filters waste from the blood to make urine?", ["Kidneys", "Liver", "Lungs", "Spleen"], "The kidneys filter blood and regulate fluids.");

  gi("Which body of water lies east of the Philippines?", ["Philippine Sea (Pacific Ocean)", "South China Sea", "Celebes Sea", "Sulu Sea"], "The Pacific Ocean (Philippine Sea) borders the archipelago on the east.");

  /* ───── LOGICAL REASONING ───── */
  const lg = (t, o, e) => add("r-logic", W, t, o, e);
  lg("If Maria studies, she passes. If Maria passes, her parents reward her. Maria’s parents did not reward her. Therefore:", ["Maria did not study.", "Maria studied but failed.", "Maria passed.", "Maria’s parents are unfair."], "Chain: study → pass → reward. No reward means no pass, which means no study.");
  lg("When the temperature drops, the lake freezes. When the lake freezes, children skate. The lake did not freeze. Therefore:", ["The temperature did not drop.", "Children skated anyway.", "The temperature dropped.", "No child can skate."], "If the temperature had dropped, the lake would have frozen. It did not, so the temperature did not drop.");

  lg("In a code, “mab tor” means big house and “mab lek” means big tree. What does “tor” mean?", ["House", "Big", "Tree", "Small"], "‘Mab’ is in both phrases and ‘big’ is in both meanings, so ‘mab’ = big. ‘Tor’ is the remaining word: house.");

/* ===== PART III: SCIENCE PROCESS SKILLS (static questions; options[0] correct) ===== */
(function () {
  const seen = new Set(QUESTIONS.map(x => x.text.replace(/\s+/g, " ").trim().toLowerCase()));
  const sp = (text, opts, exp) => { const k = text.replace(/\s+/g, " ").trim().toLowerCase(); if (seen.has(k)) return; seen.add(k); q("s-process", SRC.wst, text, opts, exp); };

  sp("Which of the following is a QUALITATIVE observation?", ["The liquid turned blue.", "The liquid measured 25 mL.", "The mass was 3 g.", "The strip was 10 cm long."], "Qualitative observations describe qualities (color, smell, texture) without numbers.");
  sp("Which of the following is a QUANTITATIVE observation?", ["The rod is 12.5 cm long.", "The rod is shiny.", "The rod feels smooth.", "The rod looks old."], "Quantitative observations include measurements or counts.");
  sp("Which statement is an INFERENCE rather than an observation?", ["The ground is wet, so it must have rained.", "The ground is wet.", "There are puddles on the road.", "The sky is gray."], "An inference is an interpretation that goes beyond what is directly seen or measured.");
  sp("A student tests how the amount of fertilizer affects the height of bean plants. What is the independent variable?", ["Amount of fertilizer", "Height of the plants", "Amount of water", "Kind of bean plant"], "The independent variable is the factor the experimenter deliberately changes.");
  sp("In the same experiment (fertilizer and plant height), what is the dependent variable?", ["Height of the plants", "Amount of fertilizer", "Amount of sunlight", "Size of the pots"], "The dependent variable is what is measured as the result.");
  sp("In that experiment, which should be kept constant (a controlled variable)?", ["Amount of water given to each plant", "Amount of fertilizer", "Final height of the plants", "Number of leaves at the end"], "Everything except the independent variable must be kept the same for a fair test.");
  sp("A hypothesis is best described as:", ["A testable, tentative explanation or prediction", "A proven fact", "A final conclusion", "A list of observations"], "A hypothesis can be tested by experiment and may be supported or rejected.");
  sp("Which is the best-written hypothesis?", ["If plants receive more sunlight, then they will grow taller.", "Plants like sunlight.", "Sunlight is important.", "Do plants need sunlight?"], "A good hypothesis is testable and states a relationship, often in ‘if … then …’ form.");
  sp("What usually comes right after forming a hypothesis in the scientific method?", ["Testing it with an experiment", "Writing the conclusion", "Stating the problem", "Publishing the results"], "Order: problem → hypothesis → experiment → data analysis → conclusion → communication.");
  sp("What is the purpose of a control group in an experiment?", ["To provide a standard for comparison", "To change the independent variable", "To increase the sample size", "To prove the hypothesis"], "The control group is not given the treatment, so any difference can be attributed to the variable tested.");
  sp("Which instrument is best for measuring the volume of a liquid accurately?", ["Graduated cylinder", "Beaker", "Test tube", "Evaporating dish"], "Graduated cylinders have fine markings; beakers are only approximate.");
  sp("Which instrument measures mass?", ["Triple-beam balance", "Thermometer", "Stopwatch", "Barometer"], "Mass is measured with a balance.");
  sp("Which of the following is NOT an SI base unit?", ["Liter", "Kilogram", "Second", "Meter"], "The liter is a derived/accepted volume unit; kg, s and m are base units.");
  sp("A student gets 5.2 g, 5.3 g and 5.2 g for a sample whose true mass is 6.0 g. The measurements are:", ["Precise but not accurate", "Accurate but not precise", "Both accurate and precise", "Neither accurate nor precise"], "They agree with each other (precise) but are far from the true value (not accurate).");
  sp("How many significant figures are in 0.0450?", ["3", "2", "4", "5"], "Leading zeros do not count; 4, 5 and the trailing 0 after the decimal do count.");
  sp("When reading the volume in a graduated cylinder, you should read:", ["The bottom of the meniscus at eye level", "The top of the meniscus from above", "The edge of the liquid from below", "Any point on the curved surface"], "The meniscus is read at its lowest point with your eye level with the liquid surface.");
  sp("A student groups leaves by shape and edge. Which process skill is being used?", ["Classifying", "Predicting", "Inferring", "Measuring"], "Classifying means sorting objects by shared properties.");
  sp("Using a pattern in data to state what will happen next is the process skill of:", ["Predicting", "Observing", "Classifying", "Communicating"], "Predicting uses patterns or past evidence to forecast a future result.");
  sp("Sharing results through tables, graphs and reports is the skill of:", ["Communicating", "Hypothesizing", "Inferring", "Controlling variables"], "Communicating means presenting findings clearly to others.");
  sp("Defining a variable by exactly how it will be measured in the experiment is called:", ["An operational definition", "A hypothesis", "An inference", "A control"], "For example, ‘plant growth’ defined as ‘height in cm after 14 days.’");
  sp("Which graph is best for showing how a quantity changes over time?", ["Line graph", "Pie chart", "Bar graph of unrelated categories", "Pictograph"], "A line graph shows trends over a continuous variable such as time.");
  sp("Which graph is best for showing how parts make up a whole?", ["Pie chart", "Line graph", "Scatter plot", "Histogram"], "A pie chart shows each category’s share of the total.");
  sp("A distance–time graph is a straight line sloping upward. What does it show?", ["Constant speed", "Constant acceleration", "The object is at rest", "Decreasing speed"], "Equal distance in equal time means constant speed (the slope).");
  sp("A data table shows that as temperature rises from 20 °C to 50 °C, the time for a tablet to dissolve falls from 80 s to 10 s. What is the relationship?", ["As temperature increases, dissolving time decreases", "As temperature increases, dissolving time increases", "Temperature has no effect on dissolving time", "Dissolving time is constant"], "The trend is an inverse relationship.");
  sp("Three trials of a plant’s growth give 12 cm, 14 cm and 13 cm. What is the average?", ["13 cm", "12 cm", "14 cm", "39 cm"], "(12 + 14 + 13) ÷ 3 = 13 cm.");
  sp("What is the first thing to do if acid splashes on your skin?", ["Rinse with plenty of water and tell the teacher", "Wipe it with a dry cloth", "Apply a base to neutralize it", "Wait to see if it hurts"], "Flush with water right away and report the incident.");
  sp("What is the safe way to smell a chemical in the laboratory?", ["Waft the vapor toward your nose with your hand", "Hold it directly under your nose", "Sniff deeply from the container", "Taste a small amount"], "Never inhale directly; fan a little vapor toward you.");
  sp("Which equipment is most suitable for heating a small amount of liquid over a flame?", ["Test tube held with a holder", "Plastic cup", "Graduated cylinder", "Funnel"], "Heat-resistant test tubes are used for small amounts; graduated cylinders are never heated.");
  sp("A microscope has a 10× eyepiece and a 40× objective lens. What is the total magnification?", ["400×", "50×", "40×", "4000×"], "Total magnification = eyepiece × objective = 10 × 40 = 400×.");
  sp("What is the difference between a scientific law and a theory?", ["A law describes what happens; a theory explains why it happens", "A law is a guess; a theory is proven", "A theory is a law that has been proven", "They mean exactly the same thing"], "Laws summarize patterns; theories are well-supported explanations.");
  sp("A scientific conclusion must be based on:", ["The data collected in the experiment", "What the experimenter hoped to find", "The most popular opinion", "A single measurement"], "Conclusions should follow from the evidence, even when it rejects the hypothesis.");
  sp("Why do scientists repeat an experiment several times?", ["To improve the reliability of the results", "To make the independent variable larger", "To avoid keeping records", "To change the hypothesis"], "Repeated trials reduce the effect of random errors.");
  sp("A student wants to find out whether detergent affects bean germination. Which setup is a fair test?", ["Same beans, soil, water and temperature; only the detergent differs", "Different beans, same detergent", "Different amounts of water and detergent in each pot", "One pot with detergent in the sun and one without in the dark"], "Only the independent variable should differ between groups.");
  sp("Mia tests which brand of paper towel absorbs the most water. What does she measure (dependent variable)?", ["The amount of water each towel absorbs", "The brand of towel", "The size of the towel pieces", "The temperature of the water"], "The measured outcome is the dependent variable.");
  sp("Which of the following is NOT a characteristic of a good hypothesis?", ["It cannot be tested", "It is testable", "It can be supported or rejected", "It is based on observation"], "A hypothesis that cannot be tested is not scientific.");
  sp("On which axis is the dependent variable usually plotted?", ["The vertical (y) axis", "The horizontal (x) axis", "Either axis", "Neither axis"], "The independent variable goes on the x-axis; the dependent variable on the y-axis.");
  sp("In a controlled experiment, how many variables should the experimenter deliberately change at a time?", ["One", "Two", "Three", "As many as possible"], "Changing one variable at a time shows which factor causes the effect.");
  sp("Which of the following can reduce bias in an experiment?", ["Using a large, randomly chosen sample", "Choosing only the best samples", "Ignoring unusual results", "Testing only once"], "Random selection and larger samples make results more representative.");
  sp("Which tool is best for measuring how long a ball takes to fall?", ["Stopwatch", "Balance", "Thermometer", "Meter stick"], "Time is measured with a stopwatch or clock.");
  sp("Which is the most reasonable estimate for the mass of an apple?", ["150 g", "15 g", "15 kg", "1.5 kg"], "A medium apple has a mass of about 150 grams.");
  sp("A student calculates the average of her trials. Which process skill is she using?", ["Using numbers", "Observing", "Classifying", "Predicting"], "Calculating means, rates and percentages is ‘using numbers.’");
  sp("Measuring the length of a leaf with a ruler is an example of:", ["Measuring", "Inferring", "Hypothesizing", "Communicating"], "Measuring means using tools to find quantities such as length, mass or time.");
  sp("A student observes that ice cubes melt faster in warm water than in cold water. Which question can be investigated from this observation?", ["Does water temperature affect how fast ice melts?", "Why is ice cold?", "Is ice better than water?", "Do all ice cubes look the same?"], "A good investigable question links a changeable factor to a measurable result.");
  sp("In an experiment, the factor that is purposely kept the same in all setups is called a:", ["Controlled variable (constant)", "Dependent variable", "Independent variable", "Hypothesis"], "Controlled variables are held constant so they cannot influence the results.");
  sp("An accepted value of a measurement is 10.0 and a student measures 9.5. Which statement about the error is correct?", ["The student’s result is 0.5 below the accepted value (5% error)", "There is no error", "The result is 5 above the accepted value", "The error is 50%"], "Percent error = |9.5 − 10.0| ÷ 10.0 × 100 = 5%.");
})();

  PASSAGES.ac1 = { title: "ACET reading passage", text: "Some say the world will end in fire,\nSome say in ice.\nFrom what I’ve tasted of desire\nI hold with those who favor fire.\nBut if it had to perish twice,\nI think I know enough of hate\nTo say that for destruction ice\nIs also great\nAnd would suffice.\nRobert Frost\nFire and Ice" };
  PASSAGES.ac2 = { title: "ACET reading passage", text: "For the young writer is almost certain to start his career by writing mushy poetry and sophomoric philosophy, permitting his fancy to reveal hedonistically among lovely phrases culled from books and sayings come down from the ancients – remnants of fascinating courses in literature and philosophy taken in college. Then slowly, almost imperceptibly, as the years pass, there comes over his writing a change not only in subject matter but in general temper and attitude.\nDaily exposed to the headlines of the newspapers, his Olympian superiority or indifference yields slowly to the persistent hammering of the facts of his own experience and of contemporary history. Upon his sophomoric certainties is cast the shadow of terrible happenings – whole nations in the grip of terror, starved, maimed or killed through no fault of their own, pawns on the bloody game of men lustful for wealth and power crushed under the heels of the dictators. An amorphous idealism or, on other hand a presocious cynicism is no longer adequate to meet the vast problems which daily present themselves before his eyes.\nNot that he has become blind to the beauty of nature and the works of man; it is only that he has begun to relate his ideas and every important thing that happens to some definite principles of beauty and justice and truth. His eyes have pierced through the veil of deception with which so much of the face of life that is ugly is covered. He has begun to pursue truth instead of phrases.\nHe is no longer a florist - scissors in hand gathering lovely blossoms; he has become a tiller of the soil, spade in hand, digging into the roots of things and planting seeds.\nLiterature and Society\nSalvador P. Lopez" };
  PASSAGES.ac3 = { title: "ACET reading passage", text: "The student’s biggest problem was a slave mentality which had been built into him by years of carrot-and -whip grading, a mule mentality which said, \"If you don’t whip me, I won’t work.\" He didn’t get whipped. He didn’t work. And the cart of civilization, which he supposedly was being trained to pull, was just going to have to creak along a little slower without him.\nThis is a tragedy, however, only if you presume that the cart of civilization, \"the system\", is pulled by mules. This is a common, vocational, \"location\" point of view, but it’s not the true learning’s attitude. True learning’s attitude is that civilization, or \" the system \", or \"society\", or whatever you want to call it, is best served not by mules but by free men. The purpose of abolishing grades and degrees is not to punish mules or to get rid of them, but to provide an environment in which that mule can turn into a free man.\nThe hypothetical student, still a mule, would drift around for a while. He would get another kind of education quite as valuable as the one he’d abandoned, in what used to be called the \"school of hard knocks.\" Instead of wasting money and time as a high-status mule, he would now have to get a job as a low-status mule, maybe as a mechanic. Actually his real status would go up. He would be making a contribution for a change. Maybe that’s what he would do for the rest of his life. Maybe he’d found his level. But don’t count on it.\nIn time six months; five years, perhaps a change could easily begin to take place. He would become less and less satisfied with a kind of dumb, day-to-day shop work. His creative intelligence, stifled by too much theory and too many grades in college, would now become re-awakened by the boredom of the shop.\nSo he would come back to our degreeless and gradeless school, but with a difference. He’d no longer be a grade-motivated person. He’d be a knowledge-motivated person. He would need no external pushing to learn. His push would come from inside. He’d be a free man.\n- Zen and The Art of Motorcycle Maintenance\nRobert Pirsig" };
  PASSAGES.ac4 = { title: "ACET reading passage", text: "1Pliant is the bamboo;2I am man of earth;3They say that from the bamboo4We had our first birth.5Am I of the body,6Or of the green leaf?7Do I have to whisper8My every sin and grief?9If the wind passes by,10Must I stoop and try11To measure fully12My flexibility?13I might have been the bamboo,14But I will be a man.15Bend me then, O Lord,16Bend me if you can.\nMan of Earth\nAmador T. Daguio" };
  PASSAGES.ac5 = { title: "ACET reading passage", text: "The Greek philosophers Democritus (460 BC), Plato, Pythagoras, and the school of the Stoics gave astrology their sanction and elevated it to pseudo-science. The idea that man’s life on earth and destiny for good or for evil is subject to the heavenly bodies and their relative positions was current in the early centuries of the Christian Era; astronomical tables were in common use on which were marked the lucky and the unlucky days and even hours.\nAs the centuries rolled on, belief in astrology grew apace and exerted a baleful influence on mankind, arousing alarming fears and extravagant hopes always doomed to disappointment; it kept the intellect in a “dreary bondage of ignorance and superstition” preventing the growth of true science “by the incessant operation of prejudice and slavery of imbecile apprehensions.” In the thirteenth century astronomy was rarely cultivated for its own sake; the movements of the moon and planets were studied with a view to determining holy days, and the stars were observed for the purpose of casting horoscopes.\nFor several centuries the rising and setting of the stars, the eclipses of the sun and moon, the appearance of the comets, the aspects, conjunctions, and oppositions of the planets, were thought to be intimately related to the production as well as the relief of diseases. The moon was believed to have special power over mental and bodily maladies, as well as over the weather and minor concerns of life - a superstition that still lingers even in enlightened minds. The position of the moon in the constellations determined the proper time for compounding and administering medicines, - a belief current at a very early period among Anglo-Saxons.\n- A Relic of Astrology\nH. Carrington Bolton\nThe word baleful in the second paragraph is synonymous to" };
  PASSAGES.ac6 = { title: "ACET reading passage", text: "In the woods here in Oregon there is a creature that eats squirrels like candy, can kill a pursuing dog in less than a second, and is in the habit of deftly flipping over porcupines and scooping out the meat as if the prickle-pig were merely a huge and startled breakfast melon.\nThis riveting creature is the fisher, a member of the mustelid family that includes weasels, otter, mink, badger, ferrets, marten, and — at the biggest and most ferocious end of the family — wolverine. Sometimes called the pekan or fisher-cat, the fisher can reach three feet long, tail included, and weigh up to 12 pounds.\nI am a guy who wanders around looking for nothing in particular, which is to say everything. In this frame of mind I have seen many things, in venues urban, suburban and rural. While ambling in the woods I have seen marten kits and three-legged elk and secret beds of watercress and the subtle dens of foxes.\nSuffice it to say that I have been much graced in these woods, but to see a fisher was not a gift I expected. Yet recently I found loose quills on a path, and then the late owner of the quills, with his or her conqueror atop the carcass staring at me.\nI do not know if the fisher had ever seen a human being before. It evinced none of the usual sensible caution of the wild creature confronted with homo violencia, and it showed no inclination whatsoever to retreat from its prize. We stared at each other for a long moment and then I sat down, thinking that a reduction of my height and a gesture of repose might send the signal that I was not dangerous, and had no particular interest in porcupine meat. Plus, I’d remembered that a fisher can slash a throat in less than a second.\nLong minutes passed. The fisher fed, cautiously. I heard thrushes and wrens. I made no photographs or recordings, and when the fisher decided to evanesce I did not take casts of its tracks, or claim the former porcupine as evidence of fisherness. I just watched and listened and now I tell you. I don’t have any heavy message to share. I was only a witness: Where there are no fishers, there was a fisher. It was a stunning creature, alert, attentive, accomplished, unafraid. I think maybe there is much where we think there is nothing. Where there are no fishers, there was a fisher. Remember that.\n- Fishering\nBrian Doyle" };

const pw = (v, n) => n === 0 ? "" : n === 1 ? v : v + sup(n);
function nf(x, d) { d = d || 0; if (Number.isInteger(Math.round(x * Math.pow(10, d)) / Math.pow(10, d)) ) d = 0; const s = (Math.round(x * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d).split("."); s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ","); return s.join("."); }
const neg = s => String(s).replace(/-(?=\d)/g, "−");

function frac(n, d) { const g = gcd(n, d); n /= g; d /= g; return d === 1 ? String(n) : n + "/" + d; }
/* build 4 distinct options: correct first, then distractors; pad numerically if needed */
function mk(topic, text, correct, wrongs, exp, numeric) {
  const out = [String(correct)];
  wrongs.forEach(w => { const s = String(w); if (!out.includes(s) && !/NaN|undefined|Infinity/.test(s)) out.push(s); });
  let k = 1;
  while (out.length < 4 && numeric && k < 40) { const c = numeric.base + numeric.step * (k % 2 ? Math.ceil(k / 2) : -Math.ceil(k / 2)); const s = numeric.fmt(c); if (!out.includes(s)) out.push(s); k++; }

  TOPICS.forEach((t, i) => {
    g += '<line x1="' + cx + '" y1="' + cy + '" x2="' + P(i, 100).split(',')[0] + '" y2="' + P(i, 100).split(',')[1] + '" stroke="var(--line)"/>';
    const lx = cx + Math.cos(ang(i)) * (R + 14), ly = cy + Math.sin(ang(i)) * (R + 14), c = Math.cos(ang(i));
    g += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '" text-anchor="' + (c > 0.25 ? 'start' : c < -0.25 ? 'end' : 'middle') + '">' + esc(SHORT[t.id]) + '</text>';
  });
  g += '<polygon points="' + TOPICS.map((t, i) => P(i, target)).join(' ') + '" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-dasharray="5 4"/>';
  g += '<polygon points="' + TOPICS.map((t, i) => P(i, values[i])).join(' ') + '" fill="var(--brand)" fill-opacity=".18" stroke="var(--brand)" stroke-width="2"/>';
  TOPICS.forEach((t, i) => { const [px, py] = P(i, values[i]).split(','); g += '<circle cx="' + px + '" cy="' + py + '" r="3.5" fill="var(--brand)"><title>' + esc(t.title) + ': ' + values[i] + '%</title></circle>'; });

}
function heatmap() {
  const counts = {}; store.attempts.forEach(a => { const k = dayKey(new Date(a.ts)); counts[k] = (counts[k] || 0) + a.n; });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(today); start.setDate(start.getDate() - 90);

}

  h += '<div class="card"><h2>About the test</h2><ul class="bul"><li>Reviewers describe it as aptitude-heavy: speed and accuracy, verbal, numerical, abstract, spatial, mechanical and logical reasoning, plus some math and science.</li><li>The mock below follows that description in seven timed parts. <b>Item counts and times are my assumptions</b>; only the “about 100 items in about 3 minutes” speed section comes from reviewer reports. I could not find an official PhilSCAAT format online, so check the official PhilSCA announcement.</li></ul></div>';
  h += '<div class="card"><h2>PhilSCAAT mock exam</h2><div class="lab" style="margin:14px 0 8px">Format</div><div class="fmt">' + Object.keys(FORMATS).map(k => '<button class="' + (ui.ph.format === k ? 'on' : '') + '" data-a="ph-format" data-id="' + k + '"><b>' + FORMATS[k].name + '</b><span>about ' + Math.round(325 * FORMATS[k].f) + ' questions</span></button>').join('') + '</div>' +
    '<div class="lab" style="margin:20px 0 4px">Parts</div>' + plan.map(p => '<div class="mrow"><span><b>' + esc(p.name) + '</b><div class="small muted">' + esc(p.note) + '</div></span><span class="muted">' + p.n + ' questions</span><span class="muted mono">' + p.min + ' min</span></div>').join('') +
    '<div class="mrow tot"><span>Total</span><span>' + tot + ' questions</span><span class="mono">' + hm(mins) + '</span></div>' +
    '<ul class="bul"><li>Every mock is a new random set: speed, series, spatial, abstract and mechanical questions are generated fresh each time.</li><li>Elapsed time is tracked and pauses if you leave this tab. The speed part is meant to be done in about 3 minutes, so push your pace there.</li></ul>' +
    '<div class="row" style="margin-top:12px"><button class="chip ' + (ui.ph.enforce ? 'on' : '') + '" data-a="ph-enforce">' + (ui.ph.enforce ? '✓ ' : '') + 'Enforce time limit (' + hm(mins) + ', auto-submit)</button></div>' +
    '<div class="row between" style="margin-top:20px"><span class="small muted">' + mine.length + ' PhilSCAAT mock' + (mine.length === 1 ? '' : 's') + ' taken</span><button class="btn primary" data-a="start-ph">Begin PhilSCAAT mock ' + icon('arrow') + '</button></div></div>';
  h += '<div class="card"><h2>PhilSCAAT cheat sheets</h2><p class="small muted" style="margin:2px 0 8px">PhilSCAAT-specific sheets, plus related sheets from the main library.</p><div class="lab" style="margin:8px 0">PhilSCAAT</div><div class="chips">' +
    PH_SHEETS.map(t => '<button class="chip on" data-a="ph-sheet" data-id="' + t.id + '">' + esc(t.short) + '</button>').join('') + '</div><div class="lab" style="margin:16px 0 8px">Related sheets</div><div class="chips">' +
    ['x-r-series', 'x-m-words', 'r-abstract', 'x-r-spatial', 'x-s-motion', 'x-s-elec', 'e-gram', 'x-r-venn'].filter(id => SHEET[id]).map(id => '<button class="chip" data-a="ph-sheet" data-id="' + id + '">' + esc(shortOf(SHEET[id])) + '</button>').join('') + '</div></div>';
  if (last) {
    const parts = {}; last.items.forEach(it => { const q = BANK[it.id]; if (!q || !it.sec) return; const p = parts[it.sec] || (parts[it.sec] = { n: 0, c: 0, t: 0, k: 0 }); p.n++; if (isCorrect(q, it.ch)) p.c++; if (it.ch != null) { p.t += it.t || 0; p.k++; } });
    h += '<div class="card"><h2>Your last PhilSCAAT mock</h2><p class="small muted" style="margin:2px 0 6px">' + fmtDate(last.ts) + ' · ' + last.correct + '/' + last.n + ' correct · ' + fmtTime(last.secs) + '</p>' + Object.keys(parts).map(k => { const p = parts[k], sec = PH_SECTIONS.find(x => x.name === k), bud = sec ? sec.min * 60 / sec.n : null; return '<div class="mbar" style="grid-template-columns:minmax(0,1fr) 120px 80px;margin-top:10px"><span class="small">' + esc(k) + '</span><div class="bar"><i style="width:' + pct(p.c, p.n) + '%"></i></div><b class="mono small">' + pct(p.c, p.n) + '%' + (p.k ? ' · ' + Math.round(p.t / p.k) + 's' : '') + (bud ? '/' + Math.round(bud) + 's' : '') + '</b></div>'; }).join('') + '<p class="small muted" style="margin:10px 0 0">Time per question: yours / assumed budget.</p><div class="row" style="margin-top:8px"><button class="btn sm" data-a="open-attempt" data-id="' + last.id + '">Review answers</button></div></div>';
  }
  return h + '</div>';
}

    ['g-chrome', 'Which browser should I use?', 'Google Chrome is recommended. Stay in the same Chrome profile on the same device so your saved progress is still there next time. Avoid private or incognito windows, because they do not keep progress.'],

  h += '<div class="card"><h2>What each section does</h2>' + sec.map(x => '<div class="planday"><div class="grow"><b>' + x[1] + '</b><div class="small muted" style="margin-top:2px">' + x[2] + '</div></div>' + go(x[0], 'Open') + '</div>').join('') + '</div>';
  h += '<div class="card"><h2>Taking an exam</h2><ul class="bul"><li>Choose an answer by tapping it, or press <b>A–E</b> or <b>1–5</b> on a keyboard. Use <b>←</b> and <b>→</b> to move between questions.</li><li>Use <b>Flag for review</b> on questions to revisit, and <b>Clear answer</b> to undo a choice. The numbered dots jump to any question.</li><li>You can leave and come back: unfinished sessions are saved and can be resumed or discarded.</li><li>Submit when done. Unanswered questions count as skipped.</li></ul></div>';
  h += '<div class="card"><h2>Reading your results</h2><ul class="bul"><li>See your score, total time, average seconds per question, and a breakdown by subject (and by CET part for mocks).</li><li>Every question shows your answer, the correct answer and a short explanation, with a link to the matching cheat sheet.</li><li>Use <b>Retake missed questions</b> to practice only what you got wrong, ideally two or three days later.</li></ul></div>';
  h += '<div class="card"><h2>Common questions</h2><div class="acc-list">' + faq.map(x => '<div class="acc' + (ui.guideOpen[x[0]] ? ' open' : '') + '"><button class="acc-h" data-a="guide-acc" data-k="' + x[0] + '" aria-expanded="' + !!ui.guideOpen[x[0]] + '"><span class="at">' + x[1] + '</span><span class="chev">›</span></button><div class="acc-b"><p>' + x[2] + '</p></div></div>').join('') + '</div></div>';
  h += '<div class="card"><h2>Suggestions and contact</h2><p style="margin:6px 0 8px">Want to request a change, report a wrong answer, suggest a topic, or simply message the developer? Send a message to the Crema page on Instagram and mention <b>WMSUCET Prep</b> so it reaches the right person.</p><ul class="bul"><li>Report a question or answer that looks wrong, with the question text if you can.</li><li>Ask for a topic, a cheat sheet or a feature.</li><li>Tell us what worked for you.</li></ul>' + (typeof SPONSOR !== 'undefined' && SPONSOR.url ? '<div class="row" style="margin-top:12px">' + contactLink('Message Crema on Instagram →', 'btn primary') + '</div>' : '') + '</div>';

/* ───────── events ───────── */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, d = el.dataset, s = store.session;
  if (a === 'modal-close-bg') { if (e.target === el) { ui.modal = null; renderModal(); } return; }
  switch (a) {
    case 'nav': go(d.v); break;
    case 'topic': openTopic(d.id, SHEET[d.id] && SHEET[d.id].scope ? { view: 'philsca' } : undefined); break;
    case 'topic-from-results': openTopic(d.id, { view: 'results' }); break;
    case 'back-results': go('results'); break;
    case 'toggle-reviewed': if (store.reviewed[d.id]) delete store.reviewed[d.id]; else store.reviewed[d.id] = Date.now(); save(); render(); break;
    case 'coach-acc': ui.coachOpen[d.k] = !ui.coachOpen[d.k]; render(); break;
    case 'coach-open-all': { const all = COACH_TECH.concat(COACH_EXAM).every(x => ui.coachOpen[x.id]); COACH_TECH.concat(COACH_EXAM).forEach(x => { ui.coachOpen[x.id] = !all; }); render(); break; }
    case 'ph-format': ui.ph.format = d.id; render(); break;
    case 'ph-enforce': ui.ph.enforce = !ui.ph.enforce; render(); break;
    case 'start-ph': startPh(); break;
    case 'ph-sheet': openTopic(d.id, { view: 'philsca' }); break;
    case 'back-philsca': go('philsca'); break;
    case 'guide-acc': ui.guideOpen[d.k] = !ui.guideOpen[d.k]; render(); break;
    case 'open-guide': store.guideSeen = true; save(); go('guide'); break;
    case 'guide-dismiss': store.guideSeen = true; save(); render(); break;
    case 'idx-subj': ui.idxSubj = d.id; render(); break;
    case 'acc': { const t = SHEET[ui.topicId], o = openOf(t); o[d.i] = !o[d.i]; render(); break; }
    case 'acc-all': { const t = SHEET[ui.topicId], o = openOf(t), accs = t.blocks.map((b, i) => [b, i]).filter(x => isAcc(x[0])), all = accs.every(x => o[x[1]]); accs.forEach(x => { o[x[1]] = !all; }); render(); break; }
    case 'acc-jump': { const t = SHEET[ui.topicId]; openOf(t)[d.i] = true; render(); const el = document.getElementById('blk-' + d.i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    case 'mode': ui.sheetMode = d.v; window.scrollTo(0, 0); render(); break;
    case 'step-prev': { const t = SHEET[ui.topicId]; ui.step[t.id] = Math.max(0, (ui.step[t.id] || 0) - 1); render(); break; }
    case 'step-next': { const t = SHEET[ui.topicId]; ui.step[t.id] = Math.min(t.blocks.length - 1, (ui.step[t.id] || 0) + 1); render(); break; }
    case 'step-go': { const t = SHEET[ui.topicId]; ui.step[t.id] = parseInt(d.i, 10); render(); break; }
    case 'step-done': { const t = SHEET[ui.topicId]; store.reviewed[t.id] = store.reviewed[t.id] || Date.now(); save(); render(); break; }
    case 'print': try { window.print(); } catch (err) {} break;
    case 'practice-topic': ui.prac.subject = TOPIC[d.id].subj; ui.prac.topic = d.id; go('practice'); break;
    case 'mock-format': ui.mock.format = d.id; render(); break;
    case 'mock-enforce': ui.mock.enforce = !ui.mock.enforce; render(); break;
    case 'mock-gi': ui.mock.gi = !ui.mock.gi; render(); break;
    case 'start-mock': startMock(); break;
    case 'prac-n': ui.prac.n = parseInt(d.n, 10); render(); break;
    case 'prac-timed': ui.prac.timed = d.v === '1'; render(); break;
    case 'prac-mins': ui.prac.mins = parseInt(d.n, 10); render(); break;
    case 'start-practice': startPractice(); break;
    case 'resume': go('exam'); break;
    case 'discard': ui.modal = { title: 'Discard this session?', body: '<p>Your in-progress answers and elapsed time will be deleted. This can’t be undone.</p>', actions: [{ label: 'Keep it', act: 'modal-close' }, { label: 'Discard', act: 'discard-yes', cls: 'danger' }] }; renderModal(); break;
    case 'discard-yes': store.session = null; save(); ui.modal = null; render(); break;
    case 'opt': if (s) { s.ans[s.qids[s.cur]] = parseInt(d.j, 10); save(); render(); } break;
    case 'clear': if (s) { delete s.ans[s.qids[s.cur]]; save(); render(); } break;
    case 'flag': if (s) { const id = s.qids[s.cur]; if (s.flags[id]) delete s.flags[id]; else s.flags[id] = 1; save(); render(); } break;
    case 'prev': if (s && s.cur > 0) { s.cur--; save(); window.scrollTo(0, 0); render(); } break;
    case 'next': if (s && s.cur < s.qids.length - 1) { s.cur++; save(); window.scrollTo(0, 0); render(); } break;
    case 'goto': if (s) { s.cur = parseInt(d.i, 10); save(); window.scrollTo(0, 0); render(); } break;
    case 'submit': {
      if (!s) break;
      const left = s.qids.length - Object.keys(s.ans).length, fl = Object.keys(s.flags).length;
      ui.modal = { title: 'Submit your ' + (s.kind === 'mock' ? 'exam' : 'session') + '?', body: '<p>' + (left ? '<b>' + left + ' unanswered</b> question' + (left > 1 ? 's' : '') + ' will be marked wrong. ' : 'You’ve answered every question. ') + (fl ? fl + ' flagged. ' : '') + 'Elapsed time: <b>' + fmtTime(s.elapsed) + '</b>.</p>', actions: [{ label: 'Keep working', act: 'modal-close' }, { label: 'Submit', act: 'submit-yes', cls: 'primary' }] };
      renderModal(); break; }
    case 'submit-yes': finishExam(); break;
    case 'modal-close': ui.modal = null; renderModal(); break;
    case 'open-attempt': ui.attemptId = parseInt(d.id, 10); ui.back = null; ui.filter = 'wrong'; go('results'); break;
    case 'filter': ui.filter = d.f; render(); break;
    case 'hist-kind': ui.hist.kind = d.k; render(); break;
    case 'hist-subj': ui.hist.subj = d.k; render(); break;
    case 'an-range': ui.an.range = parseInt(d.n, 10); render(); break;
    case 'edit-target': ui.modal = { title: 'Target score', body: '<p class="small muted">Your goal for the exam, as a percentage.</p><input class="inp" id="tgt" type="number" min="1" max="100" value="' + store.target + '" aria-label="Target score">', actions: [{ label: 'Cancel', act: 'modal-close' }, { label: 'Save', act: 'target-save', cls: 'primary' }] }; renderModal(); break;
    case 'target-save': { const v = parseInt(($('#tgt') || {}).value, 10); if (v >= 1 && v <= 100) { store.target = v; save(); } ui.modal = null; render(); break; }
    case 'retake': {
      const at = attemptById(parseInt(d.id, 10)); if (!at) break;
      const qs = at.items.filter(it => BANK[it.id] && !isCorrect(BANK[it.id], it.ch)).map(it => BANK[it.id]);
      startExam(arrange(qs), 'Retake: missed questions', 'practice', 0); break; }
    case 'reset': ui.modal = { title: 'Reset all progress?', body: '<p>This deletes your history, reviewed checkmarks, target score, and any exam in progress from this browser.</p>', actions: [{ label: 'Cancel', act: 'modal-close' }, { label: 'Reset everything', act: 'reset-yes', cls: 'danger' }] }; renderModal(); break;
    case 'reset-yes': stopTimer(); store = { reviewed: {}, attempts: [], seen: {}, session: null, target: 80, gen: {} }; save(); ui.modal = null; go('home'); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-c]'); if (!el) return;
  if (el.dataset.c === 'p-subj') { ui.prac.subject = el.value; ui.prac.topic = ''; render(); }
  else if (el.dataset.c === 'p-topic') { ui.prac.topic = el.value; render(); }
  else if (el.dataset.c === 'exam-date') { store.examDate = el.value || null; save(); render(); }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-i]'); if (el && el.dataset.i === 'mins') ui.prac.mins = el.value; });
document.addEventListener('keydown', e => {
  if (ui.view !== 'exam' || ui.modal || !store.session) return;
  if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
  const s = store.session, k = e.key.toLowerCase(), map = { a: 0, b: 1, c: 2, d: 3, e: 4, '1': 0, '2': 1, '3': 2, '4': 3, '5': 4 };
  if (k in map && map[k] < BANK[s.qids[s.cur]].opts.length) { s.ans[s.qids[s.cur]] = map[k]; save(); render(); }
  else if (e.key === 'ArrowRight' && s.cur < s.qids.length - 1) { s.cur++; save(); render(); }
  else if (e.key === 'ArrowLeft' && s.cur > 0) { s.cur--; save(); render(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* ───────── boot ───────── */
load();
function measure() { const mt = $('.mtop'); const h = mt && getComputedStyle(mt).display !== 'none' ? mt.offsetHeight : 0; document.documentElement.style.setProperty('--hh', h + 'px'); }
measure(); window.addEventListener('resize', measure);
render(); measure();
})();
</script>
